name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust_prototype/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust_prototype/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: rust_prototype
        run: cargo fmt --check

      - name: Clippy
        working-directory: rust_prototype
        # `--no-deps`: lint workspace members strictly, but don't apply our
        # `-D warnings` to the vendored `hardware-query` path dependency —
        # third-party code isn't held to our lint policy (a registry dep
        # would be `--cap-lints allow`'d automatically; vendoring by path
        # is the only reason it'd be linted at all).
        run: cargo clippy --all-targets --no-deps -- -D warnings

      - name: Build
        working-directory: rust_prototype
        run: cargo build --release

      - name: Run unit tests
        working-directory: rust_prototype
        # `--lib` only: the unit suite is self-contained and needs no
        # nuclear data. The `tests/` integration suite (ICSBEP k_eff
        # regressions, CUDA parity) requires the ~6.5 GB ENDF/B HDF5
        # libraries that CI does not provision — those run on
        # data-equipped machines via the Python sweep harness. The
        # integration targets are still compile-checked above by
        # `cargo clippy --all-targets`.
        run: cargo test --lib

  python:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install ruff

      - name: Lint scripts
        run: ruff check scripts/

  paper:
    name: Build paper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            texlive-fonts-extra texlive-science texlive-bibtex-extra biber latexmk

      - name: Compile paper
        working-directory: paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/main.pdf
